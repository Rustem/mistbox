# Mistbox dashboard = the stock Saleor 3.23 dashboard, plus one appended script
# (`mistbox-inline-errors.js`) that surfaces a refused save's real reason where
# the dashboard would otherwise show only "Invalid value". See that file and
# `Dockerfile.dashboard`. Everything else here is the image's own default.conf,
# reproduced so the injection sits in one reviewable place.
server {
    listen       80;
    server_name  localhost;
    root   /app/dashboard/;

    add_header Referrer-Policy origin-when-cross-origin;

    # Append our script to the SPA shell. sub_filter works on the static
    # index.html because the image is built --with-http_sub_module. The ?v=
    # is bumped whenever the script changes so a cached copy is never served;
    # the file itself is also sent no-store below.
    sub_filter '</body>' '<script defer src="/mistbox-inline-errors.js?v=1"></script></body>';
    sub_filter_once on;

    # Our script, never cached, so a change ships on the next reload.
    location = /mistbox-inline-errors.js {
        alias /app/dashboard/mistbox-inline-errors.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    location / {
        alias /app/dashboard/;
        index  index.html;
        try_files $uri $uri/ /dashboard/index.html;
    }

    location /dashboard/ {
        alias /app/dashboard/;
        index  index.html;
        try_files $uri $uri/ /dashboard/index.html;
    }
}
