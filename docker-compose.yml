# Mistbox — self-hosted Saleor stack, pinned to Saleor 3.23.
services:
  api:
    # Saleor 3.23 plus `saleor-plugin/`, which adds the one rule the dashboard
    # can enforce itself: a gift box cannot be saved holding more pieces than
    # it has room for. Saleor's own source is untouched — see Dockerfile.saleor.
    build:
      context: .
      dockerfile: Dockerfile.saleor
    ports: ["8000:8000"]
    restart: unless-stopped
    networks: [saleor-backend-tier]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    volumes:
      - saleor-media:/app/media
    env_file: [saleor/common.env, saleor/backend.env]

  dashboard:
    # Stock Saleor 3.23 dashboard plus `dashboard/`, which appends one script
    # that surfaces a refused save's real reason. See Dockerfile.dashboard.
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: mistbox-dashboard
    ports: ["9000:80"]
    restart: unless-stopped
    environment:
      - API_URL=http://localhost:8000/graphql/

  db:
    image: library/postgres:15-alpine
    ports: ["5432:5432"]
    restart: unless-stopped
    networks: [saleor-backend-tier]
    volumes:
      - saleor-db:/var/lib/postgresql/data
      - ./saleor/replica_user.sql:/docker-entrypoint-initdb.d/replica_user.sql
    environment:
      - POSTGRES_USER=saleor
      - POSTGRES_PASSWORD=saleor
      - POSTGRES_DB=saleor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saleor"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: valkey/valkey:8.1-alpine
    ports: ["6379:6379"]
    restart: unless-stopped
    networks: [saleor-backend-tier]
    volumes:
      - saleor-redis:/data

  worker:
    image: ghcr.io/saleor/saleor:3.23
    command: celery -A saleor --app=saleor.celeryconf:app worker --loglevel=info -B
    restart: unless-stopped
    networks: [saleor-backend-tier]
    env_file: [saleor/common.env, saleor/backend.env]
    depends_on: [redis, db]
    volumes:
      - saleor-media:/app/media

  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
    restart: unless-stopped
    networks: [saleor-backend-tier]

volumes:
  saleor-db:
  saleor-redis:
  saleor-media:

networks:
  saleor-backend-tier:
    driver: bridge
