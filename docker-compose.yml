# Mistbox — self-hosted Saleor stack, pinned to Saleor 3.23.
#
# This base file publishes NO ports at all. Compose *merges* a `ports:` list
# across `-f` files rather than letting a later file remove entries, so the
# only way for qa/prod to stay port-free is for the base file to never expose
# anything in the first place — local convenience lives in
# docker-compose.dev.yml instead, which adds the ports back for that overlay
# only. Run dev with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  api:
    # Saleor 3.23 plus `saleor-plugin/`, which adds the one rule the dashboard
    # can enforce itself: a gift box cannot be saved holding more pieces than
    # it has room for. Saleor's own source is untouched — see Dockerfile.saleor.
    build:
      context: .
      dockerfile: Dockerfile.saleor
    restart: unless-stopped
    networks: [saleor-backend-tier]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    volumes:
      - saleor-media:/app/media
    env_file: [saleor/common.env, saleor/backend.env]

  dashboard:
    # Stock Saleor 3.23 dashboard plus `dashboard/`, which appends one script
    # that surfaces a refused save's real reason. See Dockerfile.dashboard.
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: mistbox-dashboard
    restart: unless-stopped
    environment:
      - API_URL=http://localhost:8000/graphql/

  db:
    image: library/postgres:15-alpine
    restart: unless-stopped
    networks: [saleor-backend-tier]
    volumes:
      - saleor-db:/var/lib/postgresql/data
      - ./saleor/replica_user.sql:/docker-entrypoint-initdb.d/replica_user.sql
    environment:
      - POSTGRES_USER=saleor
      - POSTGRES_PASSWORD=saleor
      - POSTGRES_DB=saleor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saleor"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    networks: [saleor-backend-tier]
    volumes:
      - saleor-redis:/data

  worker:
    # Same custom image as `api` — not the stock Saleor image. The worker
    # runs Django/Celery code from the same codebase `api` does, so it needs
    # the same rules plugin installed; a stock image here was a pre-existing
    # inconsistency, not something either service actually wants.
    build:
      context: .
      dockerfile: Dockerfile.saleor
    command: celery -A saleor --app=saleor.celeryconf:app worker --loglevel=info -B
    restart: unless-stopped
    networks: [saleor-backend-tier]
    env_file: [saleor/common.env, saleor/backend.env]
    depends_on: [redis, db]
    volumes:
      - saleor-media:/app/media

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    networks: [saleor-backend-tier]

volumes:
  saleor-db:
  saleor-redis:
  saleor-media:

networks:
  saleor-backend-tier:
    driver: bridge
